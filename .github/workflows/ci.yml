name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow so a tagged commit gets exactly this
  # verification: a called run checks out the caller's ref, which for a tag
  # push is the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: enable corepack
        run: corepack enable
      - name: install
        run: yarn install --immutable
      - name: type-check
        run: yarn type-check
      - name: lint
        run: yarn lint
      - name: format
        run: yarn format
      - name: test
        run: yarn test
      - name: build
        run: yarn build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # First: main.go embeds dist/ via //go:embed, so the package does not
      # compile — and vet cannot run — until the UI has been built.
      - name: build the UI
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  # The browser tests drive the real binary against a fake Pyroscope replaying
  # captured fixtures (e2e/README.md), so they need both toolchains.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: install
        run: |
          corepack enable
          yarn install --immutable
      # Install scripts are off (.yarnrc.yml), so the browser is not part of
      # `yarn install` — nobody building the UI pays for it.
      - name: install chromium
        run: yarn playwright install --with-deps chromium
      - name: build the UI and the server
        run: |
          yarn build
          go build -o pyrolens .
      - name: e2e
        run: yarn playwright test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
