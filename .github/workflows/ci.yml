name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow so a tagged commit gets exactly this
  # verification: a called run checks out the caller's ref, which for a tag
  # push is the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - name: enable corepack
        run: corepack enable
      - name: install
        run: yarn install --immutable
      - name: type-check
        run: yarn type-check
      - name: lint
        run: yarn lint
      - name: format
        run: yarn format
      - name: test
        run: yarn test
      - name: build
        run: yarn build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # First: main.go embeds dist/ via //go:embed, so the package does not
      # compile — and vet cannot run — until the UI has been built.
      - name: build the UI
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
