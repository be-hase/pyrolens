name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow so a tagged commit gets exactly this
  # verification: a called run checks out the caller's ref, which for a tag
  # push is the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: enable corepack
        run: corepack enable
      - name: install
        run: yarn install --immutable
      - name: type-check
        run: yarn type-check
      - name: lint
        run: yarn lint
      - name: format
        run: yarn format
      - name: test
        run: yarn test
      - name: build
        run: yarn build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # First: main.go embeds dist/ via //go:embed, so the package does not
      # compile — and vet cannot run — until the UI has been built.
      - name: build the UI
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  # Nothing else builds the image, and its COPY list is maintained by hand: a
  # new file the build needs is only noticed here. Runs on every change rather
  # than behind a path filter for that reason — adding such a file does not
  # touch the Dockerfile.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: docker build -t pyrolens:ci .
      - name: it serves the app it just built
        run: |
          docker run -d --name pyrolens -p 4041:4041 pyrolens:ci
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:4041/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4041/healthz
          # A deep link has to reach the SPA shell, not a 404 from the image.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4041/comparison)
          test "$code" = 200 || { docker logs pyrolens; exit 1; }

  # Nothing else reads .goreleaser.yaml until a tag is pushed, by which point
  # a config error costs a deleted tag and a re-cut release. Validate it at
  # pull-request time instead.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Kept in step with the version release.yml pins, or this validates
          # against a different toolchain than the one that runs.
          version: v2.17.1
          args: check

  # The browser tests drive the real binary against a fake Pyroscope replaying
  # captured fixtures (e2e/README.md), so they need both toolchains.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install
        run: |
          corepack enable
          yarn install --immutable
      # Install scripts are off (.yarnrc.yml), so the browser is not part of
      # `yarn install` — nobody building the UI pays for it.
      - name: install chromium
        run: yarn playwright install --with-deps chromium
      - name: build the UI and the server
        run: |
          yarn build
          go build -o pyrolens .
      - name: e2e
        run: yarn playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
