name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; only the job that publishes gets write access.
permissions:
  contents: read

jobs:
  semver:
    # GoReleaser derives the version from the tag, and a malformed one fails
    # late and messily — refuse it before spending the verification minutes.
    runs-on: ubuntu-latest
    steps:
      - name: verify the tag is semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$' \
            || { echo "tag $TAG is not strict semver (vX.Y.Z[-prerelease][+metadata])" >&2; exit 1; }

  # Pushes to main run CI, but nothing otherwise guarantees the commit a tag
  # points at ever went through it. Runs after the cheap tag check so a
  # malformed tag never spends these minutes.
  verify:
    needs: semver
    uses: ./.github/workflows/ci.yml

  release:
    needs: [semver, verify]
    permissions:
      contents: write # creates the GitHub Release
      packages: write # pushes images to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs the full history for changelogs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The arm64 images are built on an amd64 runner.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Exact, not "~> v2": a range lets the release toolchain drift
          # between two runs of the same tag.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
