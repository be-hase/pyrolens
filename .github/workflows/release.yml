name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; only the job that publishes gets write access.
permissions:
  contents: read

jobs:
  semver:
    # GoReleaser derives the version from the tag, and a malformed one fails
    # late and messily — refuse it before spending the verification minutes.
    runs-on: ubuntu-latest
    steps:
      - name: verify the tag is semver
        env:
          TAG: ${{ github.ref_name }}
        # Build metadata is deliberately NOT accepted: `+` is legal in semver
        # but not in an OCI tag, and .goreleaser.yaml templates the version
        # straight into one — so a `v1.0.0+build.1` passed this gate and then
        # died in the release job, which is exactly what the gate exists to
        # prevent.
        run: |
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?$' \
            || { echo "tag $TAG is not a releasable semver (vX.Y.Z[-prerelease]; build metadata is not usable as an image tag)" >&2; exit 1; }

  # Pushes to main run CI, but nothing otherwise guarantees the commit a tag
  # points at ever went through it. Runs after the cheap tag check so a
  # malformed tag never spends these minutes.
  verify:
    needs: semver
    uses: ./.github/workflows/ci.yml

  release:
    needs: [semver, verify]
    permissions:
      contents: write # creates the GitHub Release
      packages: write # pushes images to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs the full history for changelogs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The arm64 images are built on an amd64 runner.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Exact, not "~> v2": a range lets the release toolchain drift
          # between two runs of the same tag.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
