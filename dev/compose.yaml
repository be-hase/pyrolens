# A Pyroscope with data in it, for developing against.
#
#   docker compose -f dev/compose.yaml up -d        # multi-tenant on :4040
#   docker compose -f dev/compose.yaml --profile single up -d   # plus :4045
#
# Then point the UI at it: `make run` (defaults to localhost:4040).
# See dev/README.md.

services:
  # Multi-tenant: the UI asks for a tenant and sends it as X-Scope-OrgID.
  #
  # Digest pinned alongside the tag (see Dockerfile) even though this compose
  # file is dev-only: it keeps `docker compose pull` reproducible and gives
  # Renovate (docker:pinDigests, renovate.json5) one consistent pattern to
  # maintain everywhere.
  pyroscope:
    image: grafana/pyroscope:2.4.0@sha256:b7e62699a27463aa3533efe3f88c320da594da495731fd6eabca6f44f92cdd7b
    command: ['-auth.multitenancy-enabled']
    ports: ['4040:4040']

  loadgen-a:
    image: golang:1.27-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    working_dir: /src
    volumes:
      - ./loadgen:/src:ro
      - gomodcache:/go/pkg/mod
    environment:
      SERVER: http://pyroscope:4040
      TENANT: team-a
      APP: checkout-service
    command: ['go', 'run', '.']
    depends_on: [pyroscope]

  loadgen-b:
    image: golang:1.27-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    working_dir: /src
    volumes:
      - ./loadgen:/src:ro
      - gomodcache:/go/pkg/mod
    environment:
      SERVER: http://pyroscope:4040
      TENANT: team-b
      APP: billing-service
    command: ['go', 'run', '.']
    depends_on: [pyroscope]

  # Single-tenant: no tenant UI at all. Opt in with `--profile single`.
  pyroscope-single:
    image: grafana/pyroscope:2.4.0@sha256:b7e62699a27463aa3533efe3f88c320da594da495731fd6eabca6f44f92cdd7b
    ports: ['4045:4040']
    profiles: ['single']

  loadgen-single:
    image: golang:1.27-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    working_dir: /src
    volumes:
      - ./loadgen:/src:ro
      - gomodcache:/go/pkg/mod
    environment:
      SERVER: http://pyroscope-single:4040
      APP: checkout-service
    command: ['go', 'run', '.']
    depends_on: [pyroscope-single]
    profiles: ['single']

volumes:
  gomodcache:
